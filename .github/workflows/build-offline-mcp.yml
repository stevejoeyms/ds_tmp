name: Build Windows offline MCP
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: x64
      - name: Build official package with locked production dependencies
        shell: pwsh
        run: ./offline-mcp/build.ps1
      - name: Verify extracted ZIP without npm
        shell: pwsh
        run: |
          $check = Join-Path $env:RUNNER_TEMP 'offline-check'
          Expand-Archive -LiteralPath dist/playwright-mcp-offline-win-x64.zip -DestinationPath $check
          $root = Join-Path $check 'playwright-mcp-offline-win-x64'
          & node (Join-Path $root 'node_modules/@playwright/mcp/cli.js') --help
          if ($LASTEXITCODE -ne 0) { throw 'Extracted CLI failed' }
          $nodePath = (Get-Command node).Source
          $job = Start-Job -ArgumentList $root,$nodePath -ScriptBlock {
            param($root,$nodePath)
            & (Join-Path $root 'start-mcp.ps1') -NodePath $nodePath
          }
          try {
            $ready = $false
            for ($i=0; $i -lt 30; $i++) {
              if (Get-NetTCPConnection -LocalPort 8931 -State Listen -ErrorAction SilentlyContinue) { $ready=$true; break }
              if ($job.State -eq 'Failed' -or $job.State -eq 'Completed') { Receive-Job $job; throw 'Server exited' }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { Receive-Job $job; throw 'Server did not listen' }
            @'
          const url = 'http://127.0.0.1:8931/mcp';
          const headers = {'Content-Type':'application/json', Accept:'application/json, text/event-stream'};
          async function request(body) {
            const r = await fetch(url, {method:'POST', headers, body:JSON.stringify(body), signal:AbortSignal.timeout(15000)});
            if (!r.ok) throw new Error('HTTP '+r.status);
            const session=r.headers.get('mcp-session-id'); if(session) headers['mcp-session-id']=session;
            if(body.id===undefined) { await r.body?.cancel(); return; }
            const text=await r.text();
            const messages=r.headers.get('content-type')?.includes('text/event-stream')
              ? text.split(/\r?\n/).filter(x=>x.startsWith('data:')).map(x=>JSON.parse(x.slice(5))) : [JSON.parse(text)];
            const result=messages.find(x=>x.id===body.id);
            if(!result || result.error) throw new Error(JSON.stringify(result));
            return result.result;
          }
          const init=await request({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2025-03-26',capabilities:{},clientInfo:{name:'offline-build-check',version:'1.0.0'}}});
          if(!init.protocolVersion || !init.capabilities?.tools) throw new Error('Invalid initialize');
          headers['MCP-Protocol-Version']=init.protocolVersion;
          await request({jsonrpc:'2.0',method:'notifications/initialized'});
          const tools=await request({jsonrpc:'2.0',id:2,method:'tools/list',params:{}});
          for(const name of ['browser_tabs','browser_snapshot','browser_click','browser_type']) {
            if(!tools.tools?.some(t=>t.name===name)) throw new Error('Missing '+name);
          }
          console.log('PASS: initialize + initialized + tools/list; no browser/DSH calls performed');
          '@ | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'check.mjs')
            & node (Join-Path $env:RUNNER_TEMP 'check.mjs')
            if ($LASTEXITCODE -ne 0) { throw 'MCP protocol check failed' }
          } finally {
            Stop-Job $job; Receive-Job $job -ErrorAction SilentlyContinue; Remove-Job $job
          }
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-mcp-offline-win-x64
          path: |
            dist/playwright-mcp-offline-win-x64.zip
            dist/playwright-mcp-offline-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "offline-mcp-win-x64-${{ github.run_number }}" dist/playwright-mcp-offline-win-x64.zip dist/playwright-mcp-offline-win-x64.zip.sha256 --title "Playwright MCP 0.0.85 - Windows x64 offline" --notes "Official locked production dependencies. No Node or browser binaries. Extract and follow README.md. CI checks CLI and MCP discovery; target DSH/browser control is not yet tested."
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
